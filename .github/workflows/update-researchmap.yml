name: update researchmap data

# Manual refresh of json/data.json from the ResearchMap public API. The API
# needs no credentials, so this workflow requires no secrets. A resulting
# commit on main triggers build-deploy.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to commit the refreshed data to
        default: develop
        required: true

permissions:
  contents: write

concurrency:
  group: update-researchmap

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch from ResearchMap
        working-directory: updater
        run: python update_merge.py

      - name: Commit if the data moved
        run: |
          set -euo pipefail
          if git diff --quiet -- json/; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/
          git commit -q -m "Refresh ResearchMap data."
          git push -q origin "HEAD:${{ inputs.branch }}"
