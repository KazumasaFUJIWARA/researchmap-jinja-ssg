<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ページ移動中</title>
  <script>
    // 3秒後にリダイレクト
    setTimeout(function() {
      window.location.href = "ja/index.html";
    }, 3000);
  </script>
</head>
<body>
  <p>このページは3秒後に <a href="ja/index.html">ja/index.html</a> に移動します。</p>
  <p>自動で移動しない場合は、リンクをクリックしてください。</p>
</body>
</html>
